<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>영수증 가계부</title>
<meta name="theme-color" content="#2f6f4f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="app-header-inner">
    <h1>📒 영수증 가계부</h1>
    <button id="driveBtn" class="drive-btn" title="Google 드라이브 연결">
      <span id="driveStatusDot" class="dot dot-off"></span>
      <span id="driveStatusText">드라이브 연결</span>
    </button>
  </div>
  <div id="syncMsg" class="sync-msg"></div>
</header>

<main>

  <!-- 요약 -->
  <section class="card" id="summaryCard">
    <div class="summary-top">
      <div>
        <div class="summary-label" id="summaryMonthLabel">이번 달 지출</div>
        <div class="summary-amount" id="summaryTotal">0원</div>
      </div>
      <button id="quickAddBtn" class="secondary-btn">＋ 직접 입력</button>
    </div>
    <div id="categoryBars" class="category-bars"></div>
  </section>

  <!-- 영수증 촬영/업로드 -->
  <section class="card">
    <h2>영수증으로 입력</h2>
    <div class="capture-row">
      <label class="capture-btn">
        📷 영수증 촬영
        <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
      </label>
      <label class="capture-btn secondary">
        🖼 갤러리에서 선택
        <input type="file" id="galleryInput" accept="image/*" hidden>
      </label>
    </div>
    <div id="ocrProgressWrap" class="ocr-progress-wrap hidden">
      <div class="ocr-progress-bar"><div id="ocrProgressFill" class="ocr-progress-fill"></div></div>
      <div id="ocrProgressText" class="ocr-progress-text">인식 준비 중...</div>
    </div>
    <img id="receiptPreview" class="receipt-preview hidden" alt="영수증 미리보기">
  </section>

  <!-- 카톡/문자 텍스트 붙여넣기 -->
  <section class="card">
    <h2>카톡/문자로 입력</h2>
    <textarea id="pasteTextInput" class="paste-textarea" rows="4" placeholder="카드 승인 문자, 계좌 입출금/이체 문자, 카드사 결제명세서를 복사해서 여기에 붙여넣으세요. 여러 건을 한 번에 붙여넣어도 자동으로 나눠서 아래 수집함에 담아요."></textarea>
    <button id="pasteTextBtn" class="secondary-btn small">📥 수집함에 담기</button>
  </section>

  <!-- 결제문자 수집함 -->
  <section class="card" id="inboxCard">
    <h2>📥 결제문자 수집함 <span id="inboxCount" class="inbox-count"></span></h2>
    <p class="inbox-hint">문자가 올 때마다, 또는 하루치를 몰아서 붙여넣으세요. 같은 문자를 다시 붙여넣어도 중복으로 쌓이지 않아요. 마무리할 때 확인하고 한 번에 가계부에 등록하거나 복사하세요.</p>
    <div id="inboxSelectAllWrap" class="inbox-selectall hidden">
      <label><input type="checkbox" id="inboxSelectAll"> 전체 선택</label>
    </div>
    <div id="inboxList" class="inbox-list"></div>
    <div id="inboxEmpty" class="empty-state">아직 모아둔 결제문자가 없어요. 위에서 문자를 붙여넣어 보세요.</div>
    <div id="inboxActions" class="inbox-actions hidden">
      <button id="inboxCopyBtn" class="secondary-btn small">📋 선택 복사</button>
      <button id="inboxDeleteBtn" class="text-btn" style="color:#c94a4a">선택 삭제</button>
      <button id="inboxRegisterBtn" class="primary-btn">선택 항목 가계부 등록</button>
    </div>
  </section>

  <!-- 인식 결과 편집 -->
  <section class="card hidden" id="reviewCard">
    <h2>인식 결과 확인 · 수정</h2>
    <div class="review-meta">
      <label>날짜 <input type="date" id="reviewDate"></label>
      <label>매장/상호 <input type="text" id="reviewStore" placeholder="예: OO마트"></label>
    </div>
    <div id="reviewRows" class="review-rows"></div>
    <button id="addRowBtn" class="secondary-btn small">＋ 항목 추가</button>
    <div class="review-actions">
      <button id="cancelReviewBtn" class="text-btn">취소</button>
      <button id="registerBtn" class="primary-btn">등록하기</button>
    </div>
  </section>

  <!-- 직접 입력 폼 -->
  <section class="card hidden" id="quickAddCard">
    <h2>직접 입력</h2>
    <div class="quick-form">
      <label>날짜 <input type="date" id="qaDate"></label>
      <label>매장/메모 <input type="text" id="qaStore" placeholder="예: OO식당"></label>
      <label>품목 <input type="text" id="qaItem" placeholder="예: 점심"></label>
      <label>금액 <input type="number" id="qaAmount" placeholder="0" inputmode="numeric"></label>
      <label>카테고리
        <select id="qaCategory"></select>
      </label>
    </div>
    <div class="review-actions">
      <button id="qaCancelBtn" class="text-btn">취소</button>
      <button id="qaSaveBtn" class="primary-btn">저장</button>
    </div>
  </section>

  <!-- 내역 리스트 -->
  <section class="card">
    <h2>지출 내역</h2>
    <div id="txList" class="tx-list"></div>
    <div id="emptyState" class="empty-state hidden">아직 등록된 지출이 없어요. 영수증을 찍거나 직접 입력해 보세요.</div>
  </section>

</main>

<div id="toast" class="toast hidden"></div>

<!-- 항목 편집용 카드 템플릿 -->
<template id="reviewRowTpl">
  <div class="review-row">
    <input type="text" class="rr-name" placeholder="품목명">
    <input type="number" class="rr-amount" placeholder="금액" inputmode="numeric">
    <select class="rr-category"></select>
    <button type="button" class="rr-delete" title="삭제">✕</button>
    <div class="rr-cardinfo hidden">
      <label>카드명칭 <input type="text" class="rr-cardname" placeholder="예: KB국민카드"></label>
      <label>결제방식 <input type="text" class="rr-installment" placeholder="예: 일시불, 3개월"></label>
      <label>누적금액 <input type="number" class="rr-accumulated" placeholder="예: 1234500" inputmode="numeric"></label>
    </div>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/tesseract.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js"></script>
<script src="categories.js"></script>
<script src="app.js"></script>
</body>
</html>
